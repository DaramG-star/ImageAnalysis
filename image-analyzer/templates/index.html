<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 이미지 분석기</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 2em; background-color: #f8f9fa; color: #343a40; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2em; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #007bff; text-align: center; }
        .tab-nav { display: flex; border-bottom: 2px solid #dee2e6; margin-bottom: 1.5em; }
        .tab-nav button { background: none; border: none; padding: 1em 1.5em; cursor: pointer; font-size: 1.1em; color: #6c757d; transition: all 0.2s ease-in-out; border-bottom: 3px solid transparent; }
        .tab-nav button.active { color: #007bff; border-bottom-color: #007bff; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .upload-form { padding: 1.5em; border: 1px solid #ddd; border-radius: 5px; background-color: #fdfdfd; }
        h2 { margin-top: 0; color: #495057; }
        label { display: block; font-weight: bold; margin-bottom: 0.5em; }
        input[type="file"] { margin-bottom: 1.5em; width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 4px; }
        input[type="submit"] { display: block; width: 100%; padding: 0.8em 1em; background-color: #007BFF; color: white; border: none; cursor: pointer; border-radius: 5px; font-size: 1.1em; transition: background-color 0.2s; }
        input[type="submit"]:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ AI 이미지 종합 분석기</h1>

        <div class="tab-nav">
            <button class="tab-button active" onclick="openTab(event, 'faceTagger')">👤 인물 사진 태깅</button>
            <button class="tab-button" onclick="openTab(event, 'similarityChecker')">✨ 유사/흐림 분석</button>
        </div>

        <!-- 인물 사진 태깅 탭 -->
        <div id="faceTagger" class="tab-content active">
            <form action="/tag_faces" method="post" enctype="multipart/form-data" class="upload-form">
                <h2>1. 기준이 될 인물 사진을 업로드하세요</h2>
                <p>각 인물 당 가장 잘 나온 사진 1장씩을 선택해주세요.</p>
                <input type="file" name="target_images" multiple required>
                
                <h2>2. 검색할 사진들을 업로드하세요</h2>
                <p>인물을 찾고 싶은 사진들을 모두 선택해주세요.</p>
                <input type="file" name="source_images" multiple required>
                <br>
                <input type="submit" value="인물 태깅 시작">
            </form>
        </div>

        <!-- 유사/흐림 분석 탭 -->
        <div id="similarityChecker" class="tab-content">
            <form action="/analyze_similarity" method="post" enctype="multipart/form-data" class="upload-form">
                <h2>분석할 이미지들을 업로드하세요</h2>
                <p>유사도를 비교하거나 흐린 사진을 찾고 싶은 이미지들을 모두 선택해주세요.</p>
                <input type="file" name="images" multiple required>
                <br>
                <input type="submit" value="유사/흐림 분석 시작">
            </form>
        </div>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
    </script>
</body>
</html>
